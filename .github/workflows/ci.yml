name: ci
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [release, sanitize]
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: |
          if [ "${{ matrix.config }}" = "sanitize" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCARTERET_ASAN=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: build
        run: cmake --build build -j
      - name: test
        run: ctest --test-dir build --output-on-failure

# CI covers correctness only. A shared runner has no core isolation, no
# frequency control and unknown co-tenants, so it cannot produce an
# interpretable timing. Benchmarks are a manual run on a named host, recorded
# in docs/benchmarks.md.
