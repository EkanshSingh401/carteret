name: ci
on: [push, pull_request]

# The two-compiler matrix is not redundancy. std::mt19937_64 is specified down
# to its exact sequence but the <random> distributions are not, so a draw taken
# through one diverges between libstdc++ and libc++ -- which it did, silently,
# until the matrix caught it. tests/test_rng_golden.cpp pins every draw and
# runs here under both, so that divergence cannot come back.

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [release, asan]
    steps:
      - uses: actions/checkout@v4
      - name: select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc"   >> "$GITHUB_ENV"
            echo "CXX=g++"  >> "$GITHUB_ENV"
          fi
      - name: configure
        run: cmake --preset ${{ matrix.preset }}
      - name: build
        run: cmake --build --preset ${{ matrix.preset }} -j
      - name: test
        run: ctest --preset ${{ matrix.preset }}

  # The compiler matrix above catches a standard library that consumes the
  # engine differently. It cannot catch a MATH LIBRARY that rounds differently,
  # because both of its jobs run on the same glibc. exponential_ns() calls
  # std::log1p, which is not required to be correctly rounded, so this job runs
  # the golden draws against Apple's libm as well. The two must agree exactly;
  # sampling.hpp explains why quantization makes that the expected outcome and
  # what a disagreement would mean.
  golden-draws:
    name: golden draws / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake --preset release
      - name: build
        run: cmake --build --preset release --target test_rng_golden -j
      - name: golden draws
        run: ctest --preset release -R rng_golden --output-on-failure

  fuzz-smoke:
    name: fuzz smoke (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A short campaign from a seeded corpus is a regression check, not a
      # search. Long campaigns are run manually with tools/fuzz.sh and their
      # results recorded in docs/correctness.md.
      - name: fuzz
        env:
          CXX: clang++
        run: tools/fuzz.sh 60

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check formatting
        run: |
          clang-format --version
          find include src tests tools bench -type f \( -name '*.hpp' -o -name '*.cpp' \) \
            | xargs --no-run-if-empty clang-format --dry-run --Werror

# CI covers correctness only. A shared runner has no core isolation, no
# frequency control and unknown co-tenants, so it cannot produce an
# interpretable timing. Benchmarks are a manual run on a named host, recorded
# in docs/benchmarks.md.
