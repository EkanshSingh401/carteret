# Held-out run lock.
#
# research/run_heldout.sh refuses to run until this file names a commit that:
#   - is an ancestor of HEAD, and
#   - contains a docs/preregistration.md identical to the one in the working
#     tree.
#
# The author writes that hash here, by hand, in a commit of his own, after
# choosing the primary hypothesis and completing the pre-registration. The
# point is that the registration is fixed and public before any held-out data
# is fetched; a hash written by the same process that runs the study would
# establish nothing.
#
# Section 10 of docs/preregistration.md fixes the order these are written in,
# and this file carries three things rather than one so that a reader can
# check it rather than trust it:
#
#   commit    <40-hex-sha>   the registration commit, pushed before CI ran
#   ci_run    <id>           the workflow run that went green on that commit
#   sha256    <64-hex>       of docs/preregistration.md AT that commit
#
# The digest is the part that matters. A lock naming only a commit is
# satisfied by editing the registration afterwards and amending; a lock
# carrying the registration's digest is not, because recomputing it is
# something anyone can do. run_heldout.sh recomputes it and refuses on a
# mismatch.
#
# SET 2026-09-25, third revision, after the runner was found to be wired to
# the script the first amendment replaced. The held-out sessions ARE on disk,
# fetched and verified under explicit authorisation. No feature or label has
# been computed from either.

commit    29228cc4a3b493cf05ecaf66e14186541f9a402d
ci_run    36093805913
sha256    28f10db45fff7316df6acca3c2871a9805511c893e1f8d36c4ac28e7f265708a
frozen    6b8a682ebca56c15de27de9ddc553eb3ef08382a

# commit  the registration, UNCHANGED through three harness amendments. Not a
#         byte of docs/preregistration.md has been edited, because its digest
#         is what makes the registration checkable.
# sha256  of that file at that commit, and still:
#
#           git show 29228cc:docs/preregistration.md | shasum -a 256
#
# frozen  the frozen-code base: the third amendment, which rewired
#         run_heldout.sh onto research/heldout_study.py. Verify with
#
#           sh tools/check_frozen.sh
#
#         which is THREE checks, because one was not enough and the single
#         check it replaced could never pass: this file lives under research/,
#         so a lock commit always follows the amendment it names. The checks
#         are the frozen surface excluding this file, this file since the
#         commit that wrote it, and the working tree against HEAD -- the last
#         because the first two compare committed states while the code that
#         would actually run can sit uncommitted beside them.
#
# ci_run  the run green on the third amendment.
#
# WHAT THIS LOCK DOES NOT COVER. Section 8 left the signal threshold and the
# minimum-fills rule unfilled, so the STRATEGY component was never fully
# registered. It is exploratory under parameters declared in
# docs/heldout-harness-amendment.md section 2. The CONFIRMATORY scope --
# primary C, the Holm family of five, the direct-value secondary -- reads no
# unfilled constant and is unaffected.
#
# THE COMMANDS THE RUN WILL EXECUTE are recorded in section 3 of that
# document, and run_heldout.sh --dry-run refuses to proceed unless what it
# would run matches them.
