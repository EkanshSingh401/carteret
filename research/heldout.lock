# CONSUMED. The run happened, once, on 2026-09-25. This lock is spent.
#
# executed  the commit HEAD pointed at when run_heldout.sh ran, recorded by
#           the runner itself into results/heldout/head.txt and committed in
#           the results commit. It is not the author's word for it.
# results   the commit carrying the outputs, the command list and the
#           pre-run checks.
# binary    the SHA-256 of each binary the run invoked, recorded before it
#           started and committed in docs/generated/heldout/prerun_checks.txt.
#
# WHAT check_frozen.sh VERIFIES ONCE A LOCK IS CONSUMED. A spent lock makes a
# claim about the past, not about HEAD, and the code has moved on since -- the
# tape comment in src/strategy_pnl.cpp was corrected after the run. Checking a
# historical claim against HEAD would fail for ever and would say nothing
# about whether the run was sound, so the check becomes:
#
#   git diff <frozen> <executed> -- research/ src/ include/ tools/ \
#     ':!research/heldout.lock'      must be empty
#
# and the recorded binary digests must match what the run recorded. Both are
# facts about the past that no later commit can change.
#
# A NEW HELD-OUT RUN NEEDS A NEW LOCK. This one cannot be reused: the result
# it authorised exists, and research/run_heldout.sh refuses a second run while
# results/heldout is populated.

# commit  the registration, UNCHANGED through three harness amendments. Not a
#         byte of docs/preregistration.md has been edited, because its digest
#         is what makes the registration checkable.
# sha256  of that file at that commit, and still:
#
#           git show 29228cc:docs/preregistration.md | shasum -a 256
#
# frozen  the frozen-code base: the third amendment, which rewired
#         run_heldout.sh onto research/heldout_study.py. Verify with
#
#           sh tools/check_frozen.sh
#
#         which is THREE checks, because one was not enough and the single
#         check it replaced could never pass: this file lives under research/,
#         so a lock commit always follows the amendment it names. The checks
#         are the frozen surface excluding this file, this file since the
#         commit that wrote it, and the working tree against HEAD -- the last
#         because the first two compare committed states while the code that
#         would actually run can sit uncommitted beside them.
#
# ci_run  the run green on the third amendment.
#
# WHAT THIS LOCK DOES NOT COVER. Section 8 left the signal threshold and the
# minimum-fills rule unfilled, so the STRATEGY component was never fully
# registered. It is exploratory under parameters declared in
# docs/heldout-harness-amendment.md section 2. The CONFIRMATORY scope --
# primary C, the Holm family of five, the direct-value secondary -- reads no
# unfilled constant and is unaffected.
#
# THE COMMANDS THE RUN WILL EXECUTE are recorded in section 3 of that
