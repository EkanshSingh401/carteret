ci_run    36073139831
sha256    28f10db45fff7316df6acca3c2871a9805511c893e1f8d36c4ac28e7f265708a
frozen    d6600caf9ab0ce7a6db4a6a2c3141a33fcb6217e

# commit  the registration, UNCHANGED. Candidate C is the primary. Neither
#         harness amendment edited a byte of docs/preregistration.md, because
#         its digest is what makes the registration checkable.
# sha256  of that file at that commit, and still. Recompute it with
#
#           git show 29228cc:docs/preregistration.md | shasum -a 256
#
# frozen  the frozen-code base: the second harness amendment. Analysis and
#         tooling are frozen as of d6600ca, and the check is
#
#           git diff d6600ca HEAD -- research/ src/ include/ tools/
#
# ci_run  the run green on that amendment, all nine jobs, including the check
#         that the registration quotes only computed values and the new check
#         that every placeholder in it is allowlisted.
#
