# commit  the registration, unchanged. Candidate C is the primary.
# sha256  of docs/preregistration.md AT that commit, and UNCHANGED since:
#         the harness amendment deliberately edited no part of it, because
#         its digest is what makes the registration checkable.
#
#           git show 29228cc:docs/preregistration.md | shasum -a 256
#
# frozen  the frozen-code base. The first lock used the registration commit
#         for this, but the held-out harness did not implement the registered
#         rules and had to be amended; docs/heldout-harness-amendment.md says
#         what was wrong and what replaced it. Analysis and tooling are frozen
#         as of 1acf208, not 29228cc, and the check is
#
#           git diff 1acf208 HEAD -- research/ src/ include/ tools/
#
# ci_run  the run that went green on the amendment, all nine jobs, including
#         the check that every number quoted in the registration matches what
#         research/gated.py produced.
#
# research/run_heldout.sh recomputes the digest and refuses on a mismatch.
#
# THE RUN IS BLOCKED, and not by anything in this lock. Section 8 of the
# registration ends "Signal threshold *(to be filled)*. Minimum fills per
# session *(to be filled)*." Both are registered constants that were never
# filled. Without the first there is no maker strategy and no P&L; without the
# second, section 9's minimum-fills criterion cannot be evaluated.
# research/heldout_study.py exits 3 and names them rather than choosing.
#
# Filling them edits docs/preregistration.md, which changes the digest above
# and invalidates this lock. That is not a flaw in the lock; it is the lock
# working. A new registration commit and a new lock are required, and there is
# no way to supply a missing registered constant without them.
