# Held-out run lock.
#
# research/run_heldout.sh refuses to run until this file names a commit that:
#   - is an ancestor of HEAD, and
#   - contains a docs/preregistration.md identical to the one in the working
#     tree.
#
# The author writes that hash here, by hand, in a commit of his own, after
# choosing the primary hypothesis and completing the pre-registration. The
# point is that the registration is fixed and public before any held-out data
# is fetched; a hash written by the same process that runs the study would
# establish nothing.
#
# Section 10 of docs/preregistration.md fixes the order these are written in,
# and this file carries three things rather than one so that a reader can
# check it rather than trust it:
#
#   commit    <40-hex-sha>   the registration commit, pushed before CI ran
#   ci_run    <id>           the workflow run that went green on that commit
#   sha256    <64-hex>       of docs/preregistration.md AT that commit
#
# The digest is the part that matters. A lock naming only a commit is
# satisfied by editing the registration afterwards and amending; a lock
# carrying the registration's digest is not, because recomputing it is
# something anyone can do. run_heldout.sh recomputes it and refuses on a
# mismatch.
#
# SET 2026-09-24, revised the same day after the held-out harness amendment.
# The held-out sessions ARE on disk, fetched and verified under explicit
# authorisation after the first lock. No feature or label has been computed
# from either; docs/manifests/ records the contents of data/ and results/ with
# digests at every step.

